name: scorecard

# OpenSSF Scorecard: an independent, published score for how this repository is run (branch
# protection, pinned dependencies, token permissions, code scanning, and so on). GitHub has no
# single "security" badge of its own; this is the one a reader can click through and check.
# The score is public and is whatever it is: the badge in the readme shows it, good or bad.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 2"
  # Scorecard reads branch protection, so a change to it is worth a fresh score.
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to list the findings under Security → Code scanning
      id-token: write # to publish the score, which the badge reads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
