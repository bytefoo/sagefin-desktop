name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      # `node_modules/` in .gitignore matches a folder and not a link, so a link named node_modules
      # was once committed, and pulling it replaced a real folder with a link to itself.
      - name: Nothing installed is committed
        run: |
          if git ls-files --error-unmatch node_modules dist >/dev/null 2>&1; then
            echo "::error::node_modules or dist is tracked"
            exit 1
          fi
      # lib/ imports nothing from Electron, so the tests run before anything is installed. The
      # count is checked because a glob that matches nothing exits 0 having run nothing.
      - name: Test
        run: |
          files=$(find lib -name '*.test.mjs' | wc -l)
          out=$(node --test --test-reporter=tap "lib/*.test.mjs") && status=0 || status=$?
          echo "$out" | tail -12
          ran=$(echo "$out" | sed -n 's/^# tests //p')
          if [ "$files" -eq 0 ] || [ "${ran:-0}" -eq 0 ]; then
            echo "::error::$files test files, ${ran:-0} tests ran: the step checked nothing"
            exit 1
          fi
          exit $status

  # Every file that starts `// @ts-check` is checked against the types its comments declare. The
  # editor already does this as the code is written; this is what stops a change that breaks one
  # being merged.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Electron's types come with its package; its own download is not needed to read them.
      - run: npm ci --ignore-scripts
      # The count is checked because a check of no files passes.
      - name: Check types
        run: |
          checked=$(git grep -l '^// @ts-check' -- '*.mjs' '*.cjs' '*.js' | wc -l)
          echo "$checked files opt in"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no file starts with // @ts-check: the step checked nothing"
            exit 1
          fi
          npm run typecheck

  # The readers of a store's page, run against pages nobody wrote. Apart from `test` because
  # fast-check has to be installed, and `test` proves lib/ needs nothing installed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # Only fast-check is used, so Electron's own download is skipped.
      - run: npm ci --ignore-scripts
      - name: Fuzz
        run: |
          files=$(find fuzz -name '*.fuzz.js' | wc -l)
          out=$(node --test --test-reporter=tap "fuzz/*.fuzz.js") && status=0 || status=$?
          echo "$out" | tail -60
          ran=$(echo "$out" | sed -n 's/^# tests //p')
          if [ "$files" -eq 0 ] || [ "${ran:-0}" -eq 0 ]; then
            echo "::error::$files fuzz files, ${ran:-0} tests ran: the step checked nothing"
            exit 1
          fi
          exit $status

  # The same packaging a release does, without an installer and without publishing, so a change
  # that breaks the build is found on its pull request and not on a tag.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack
      - name: Tests are not shipped, and the app's own files are
        run: |
          npx asar list dist/linux-unpacked/resources/app.asar > packed.txt
          grep -q '^/main/main.mjs$' packed.txt
          grep -q '^/build/icon.png$' packed.txt
          # The updater is the one library the app ships; without it the packaged app fails to start.
          grep -q '^/node_modules/electron-updater/package.json$' packed.txt
          ! grep -q '\.test\.mjs$' packed.txt
          ! grep -q -e '^/fuzz/' -e '^/node_modules/fast-check/' packed.txt
      # Packaging can succeed and the app still not start: a library left out of the package, or
      # one that cannot be imported, only fails when the app runs. Start it for a few seconds;
      # `timeout` exiting 124 means it was still running when stopped, which is the pass.
      - name: The packaged app starts
        run: |
          ls dist/linux-unpacked | head -20
          code=0
          timeout 15 xvfb-run -a dist/linux-unpacked/sagefin-desktop --no-sandbox > run.log 2>&1 || code=$?
          tail -20 run.log
          if [ "$code" -ne 124 ]; then
            echo "::error::the packaged app exited by itself with code $code"
            exit 1
          fi
