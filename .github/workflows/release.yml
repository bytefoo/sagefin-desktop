name: release

# Run by hand from the Actions tab, on main. It works out the next version, builds the app on each
# system and attaches the files to a DRAFT release, which a person reads and publishes. Nothing
# here publishes a release by itself, and nothing here creates a tag: GitHub creates the tag, at
# the commit that was built, when the draft is published.
#
# The version is <major>.<minor> from package.json and the number of commits on main as the patch,
# so it goes up with every merge and nobody has to remember to bump it. To start a new minor or
# major, change package.json.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One job makes the draft, so three builds do not race to create it.
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # The version counts every commit.
      - name: Work out the version
        id: version
        run: |
          version=$(node scripts/version.mjs "$(git rev-list --count HEAD)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: node --test "lib/*.test.mjs"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" \
                 --notes "Test build. Not code-signed: see the readme for what each system asks on first run."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stamped into this job's copy only, never committed: the built app reads its version from it.
      - name: Set the version
        run: npm pkg set version=${{ needs.draft.outputs.version }}
      # Signing is not set up yet. The macOS build is ad-hoc signed (package.json, mac.identity),
      # and this stops electron-builder looking for a certificate in the runner's keychain.
      - name: Build and attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always

  # What a person downloading a file can check it against.
  checksums:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add each file's SHA-256 to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.draft.outputs.version }}
        run: |
          mkdir files && cd files
          gh release download "$TAG" --pattern 'SageFin-Desktop-*'
          count=$(ls | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::the release has no files"; exit 1; fi
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n## SHA-256\n\n```\n'
            sha256sum * | sort -k2
            printf '```\n'
          } > ../notes.md
          gh release edit "$TAG" --notes-file ../notes.md
