name: release

# Run by hand from the Actions tab, on main. It works out the next version, builds the app on each
# system, attaches the files to a draft release, and publishes it once every build and the
# checksums are in. The release stays a draft until then, so a half-built one is never public and
# a failed run leaves a draft behind rather than a broken release. Publishing creates the tag, at
# the commit that was built.
#
# The version is <major>.<minor> from package.json and the number of commits on main as the patch,
# so it goes up with every merge and nobody has to remember to bump it. To start a new minor or
# major, change package.json.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One job makes the draft, so three builds do not race to create it. Its notes are the line
  # below and then what changed: GitHub lists every pull request merged since the last release.
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # The version counts every commit.
      - name: Work out the version
        id: version
        run: |
          version=$(node scripts/version.mjs "$(git rev-list --count HEAD)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: node --test "lib/*.test.mjs"
      # Whether the macOS build will be signed is decided by the same secret its build checks.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MAC_SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          if [ "$MAC_SIGNED" = "true" ]; then
            notes="Test build. The macOS app is signed with a Developer ID and notarized by Apple. Windows and Linux are not code-signed: see the readme for what each asks on first run."
          else
            notes="Test build. Not code-signed: see the readme for what each system asks on first run."
          fi
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" \
                 --notes "$notes" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write # The provenance below is signed with this run's own identity.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stamped into this job's copy only, never committed: the built app reads its version from it.
      - name: Set the version
        run: npm pkg set version=${{ needs.draft.outputs.version }}
      # The key helper, which electron-builder carries into the app's resources folder. Not
      # code-signed, as the installer is not: there is no Windows signing certificate yet.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: runner.os == 'Windows'
        with:
          dotnet-version: 10.0.x
      - name: Build the Windows key helper
        if: runner.os == 'Windows'
        shell: bash
        run: native/windows/build.sh
      # Windows and Linux are not code-signed. This stops electron-builder looking for a
      # certificate, and it uploads their files and update manifests to the draft itself.
      - name: Build and attach to the draft
        if: runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always
      # electron-builder skips an extra resource that is not there, so a helper that failed to
      # build would ship a Windows app that holds no key, and say nothing. The release stays a
      # draft when this fails.
      - name: The Windows app carries its key helper
        if: runner.os == 'Windows'
        shell: bash
        run: test -f dist/win-unpacked/resources/sagefin-keys.exe
      # macOS is signed with the Developer ID and notarized when the signing secrets are set, and
      # ad-hoc signed as before when they are not (scripts/mac-signing.sh). After npm ci, so no
      # package's install script runs with the keychain unlocked.
      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/mac-signing.sh
      # Built without publishing, because the disk image is stapled after electron-builder has
      # hashed it (scripts/mac-build.sh); then attached with the manifest that describes it.
      - name: Build macOS and attach to the draft
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAG: v${{ needs.draft.outputs.version }}
        run: |
          scripts/mac-build.sh
          gh release upload "$TAG" dist/SageFin-Desktop-* dist/latest-mac.yml --clobber
      - name: Remove the macOS signing files
        if: always() && runner.os == 'macOS'
        run: scripts/mac-signing-end.sh
      # A signed statement that these exact files were built by this workflow, from this commit of
      # this repository. It is not code signing: the systems' first-run warnings are unchanged. It
      # is what lets anyone check a download with `gh attestation verify`, as the readme shows.
      - name: Attest where the files were built
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SageFin-Desktop-*.dmg
            dist/SageFin-Desktop-*.zip
            dist/SageFin-Desktop-*.exe
            dist/SageFin-Desktop-*.AppImage
      # Attached as well as recorded by GitHub, so the proof travels with the release.
      - name: Attach the provenance to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.draft.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "provenance-${{ runner.os }}.intoto.jsonl"
          gh release upload "$TAG" "provenance-${{ runner.os }}.intoto.jsonl" --clobber

  # What a person downloading a file can check it against.
  checksums:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add each file's SHA-256 to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.draft.outputs.version }}
        run: |
          mkdir files && cd files
          gh release download "$TAG" --pattern 'SageFin-Desktop-*'
          count=$(ls | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::the release has no files"; exit 1; fi
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n## SHA-256\n\n```\n'
            sha256sum * | sort -k2
            printf '```\n'
          } > ../notes.md
          gh release edit "$TAG" --notes-file ../notes.md

  # Last, and only if everything before it succeeded. Until here the release is a draft nobody can
  # see; from here the download links and the updater's feed point at it.
  publish:
    needs: [draft, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.draft.outputs.version }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
