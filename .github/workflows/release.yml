name: release

# A release is a tag. Pushing v<version> builds the app on each system and attaches the files to a
# DRAFT release, which a person reads and publishes. Nothing here publishes a release by itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One job makes the draft, so three builds do not race to create it.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tag is the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Test
        run: node --test "lib/*.test.mjs"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
                 --notes "Test build. Not code-signed: see the readme for what each system asks on first run."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Signing is not set up yet. The macOS build is ad-hoc signed (package.json, mac.identity),
      # and this stops electron-builder looking for a certificate in the runner's keychain.
      - name: Build and attach to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always

  # What a person downloading a file can check it against.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add each file's SHA-256 to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir files && cd files
          gh release download "$GITHUB_REF_NAME" --pattern 'SageFin-Desktop-*'
          count=$(ls | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::the release has no files"; exit 1; fi
          {
            gh release view "$GITHUB_REF_NAME" --json body --jq .body
            printf '\n## SHA-256\n\n```\n'
            sha256sum * | sort -k2
            printf '```\n'
          } > ../notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file ../notes.md
