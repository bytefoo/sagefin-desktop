version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      electron-builder:
        patterns: ["electron-builder*", "app-builder-*", "dmg-builder"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every github/codeql-action step must run the same version, or CodeQL fails the job.
      codeql-action:
        patterns: ["github/codeql-action*"]
