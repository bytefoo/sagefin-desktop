<!DOCTYPE html>
<!-- Made up, in the shape of the page Amazon serves when it is having trouble ("Sorry! Something went
     wrong!", the dogs of Amazon). The order number is a placeholder, and it is linked on purpose: an
     error page that links back to the order it could not show must not be taken for that order. -->
<html lang="en-us">
<head><meta charset="utf-8"><title>Sorry! Something went wrong!</title></head>
<body>
<a href="/ref=cs_503_logo"><img src="https://images.example.invalid/logo.png" alt="Amazon.com"></a>
<div id="g">
  <h2>Sorry! Something went wrong on our end. Please go back and try again or go to Amazon's home page.</h2>
  <a href="/ref=cs_503_link">Go to Amazon's home page</a>
  <a href="/gp/your-account/order-details?orderID=113-0000001-0000001">Try again</a>
  <img src="https://images.example.invalid/dog.jpg" alt="Dogs of Amazon">
</div>
</body>
</html>
